<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ommega</title>
<style>
  /* 自包含单文件：样式和脚本都内联，不依赖任何外部资源。管理器自己把 webroot/ 当
     静态目录 serve 并注入 window.ksu，不用另起 http 服务。
     排版原则：默认那屏只放常用的（运行状态 + 远控 + 应用），进阶的折起来。 */
  :root{
    --bg:#f5f6f8; --card:#fff; --fg:#1b1c1f; --dim:#6b6f76;
    --line:#e3e5e9; --accent:#3867d6; --ok:#1e9e5a; --bad:#d64545;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#141518;--card:#1e2024;--fg:#eceef2;--dim:#9aa0a8;--line:#2c2f35;--accent:#7aa2f7;--ok:#4ec97b;--bad:#f0736f;}
  }
  *{box-sizing:border-box}
  body{margin:0;padding:16px 14px 40px;background:var(--bg);color:var(--fg);
       font:15px/1.6 -apple-system,"Noto Sans SC","Segoe UI",Roboto,sans-serif}
  h1{margin:0 0 4px;font-size:19px;font-weight:600}
  .sub{color:var(--dim);font-size:13px;margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:12px 14px;margin-bottom:12px}
  .card h2{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--dim)}
  .row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:0}
  .row .name{flex:1;min-width:0}
  .row .name b{display:block;font-weight:500;font-size:14px}
  .row .name small{display:block;color:var(--dim);font-size:12px;line-height:1.45}
  .row input[type=text],.row select{flex:0 0 46%;min-width:0;padding:7px 9px;
    border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);
    font-size:13px;font-family:inherit}
  .sw{position:relative;flex:0 0 46px;height:26px;border-radius:13px;background:#c9ccd2;
      cursor:pointer;transition:background .15s;border:0;padding:0}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
      background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .sw[aria-checked=true]{background:var(--accent)}
  .sw[aria-checked=true]::after{left:23px}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
  button.btn{flex:1;min-width:96px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
      background:var(--card);color:var(--fg);font-size:14px;font-family:inherit}
  button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.btn.sm{flex:0 0 auto;min-width:0;padding:6px 10px;font-size:13px;border-radius:8px}
  .kv{display:flex;gap:10px;font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
  .kv:first-of-type{border-top:0}
  .kv span:first-child{color:var(--dim);flex:0 0 104px}
  .kv span:last-child{flex:1;min-width:0;word-break:break-all;font-family:ui-monospace,monospace}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#c9ccd2}
  .dot.on{background:var(--ok)} .dot.off{background:var(--bad)}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(70px);
      background:#20232a;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;
      max-width:86vw;opacity:0;transition:.22s;pointer-events:none;z-index:99}
  #toast.show{opacity:1;transform:translateX(-50%)}
  #toast.err{background:#8d2b2b}
  #boot{color:var(--dim);font-size:13px;padding:8px 0}
  .hidden{display:none}
  details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
  details>summary{padding:12px 14px;font-size:14px;font-weight:600;color:var(--dim);cursor:pointer;list-style:none}
  details>summary::-webkit-details-marker{display:none}
  details>summary::after{content:"＋";float:right;font-weight:400;color:var(--accent);font-size:14px}
  details[open]>summary::after{content:"－"}
  details>.body{padding:0 14px 12px}
  #appview{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
  #appview.hidden{display:none}
  .av-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .av-head b{flex:1;font-size:15px}
  .av-body{flex:1;overflow:auto;padding:12px 14px}
  .av-foot{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
  .av-foot .btn{flex:0 0 auto}
  .av-foot .hint{flex:1;margin:0}
  .av-search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
      background:var(--card);color:var(--fg);font-size:13px;font-family:inherit;margin-bottom:8px}
  .toolbar{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
  #applist{max-height:none;overflow:visible;background:var(--card);border:1px solid var(--line);border-radius:10px}
  .app{display:flex;align-items:center;gap:10px;padding:7px 9px;border-top:1px solid var(--line)}
  .app:first-child{border-top:0}
  .app img{width:28px;height:28px;border-radius:6px;flex:0 0 28px;background:var(--line)}
  .app .meta{flex:1;min-width:0}
  .app .meta b{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .app .meta small{display:block;color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .app select{flex:0 0 104px;padding:5px 6px;border:1px solid var(--line);border-radius:8px;
      background:var(--bg);color:var(--fg);font-size:12.5px;font-family:inherit}
  .app.on{background:rgba(56,103,214,.07)}
  .app.off .meta,.app.off select{opacity:.45}
  .hint{color:var(--dim);font-size:12px;line-height:1.5;margin:6px 0 0}
</style>
</head>
<body>

<h1>Ommega</h1>
<div class="sub" id="modline"></div>
<div id="boot" data-i18n="boot"></div>

<div id="panel" class="hidden">

  <div class="card">
    <h2 data-i18n="status.title"></h2>
    <div class="kv"><span>keymint</span><span id="st-keymint">-</span></div>
    <div class="kv"><span>keystore2</span><span id="st-keystore">-</span></div>
    <div class="kv"><span>adbr</span><span id="st-adbr">-</span></div>
    <div class="acts">
      <button class="btn primary" id="open-status" data-i18n="status.open"></button>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="remote.title"></h2>
    <div id="grp-remote"></div>
    <div class="acts">
      <button class="btn primary" id="save-remote" data-i18n="remote.save"></button>
    </div>
    <p class="hint" data-i18n="remote.hint"></p>
  </div>

  <div class="card">
    <h2 data-i18n="apps.title"></h2>
    <div class="kv"><span data-i18n="apps.count"></span><span id="app-count">-</span></div>
    <div class="acts">
      <button class="btn primary" id="open-apps" data-i18n="apps.manage"></button>
    </div>
    <p class="hint" data-i18n="apps.hint"></p>
  </div>

  <details>
    <summary data-i18n="patch.title"></summary>
    <div class="body">
      <div id="grp-patch"></div>
      <div class="kv"><span data-i18n="patch.current"></span><span id="patch-summary">-</span></div>
      <div class="acts">
        <button class="btn primary" id="patch-sync" data-i18n="patch.sync"></button>
        <button class="btn sm" id="patch-edit" data-i18n="patch.manual"></button>
      </div>
      <p class="hint" data-i18n="patch.sync.hint"></p>
      <p class="hint" data-i18n="patch.store.hint"></p>
      <div id="patch-manual" class="hidden">
        <div class="row"><div class="name"><b data-i18n="patch.hash"></b><small data-i18n="patch.hash.hint"></small></div>
          <input type="text" id="boot-hash" autocapitalize="none"></div>
        <div class="row"><div class="name"><b data-i18n="patch.system"></b><small data-i18n="patch.system.hint"></small></div>
          <input type="text" id="patch-system" autocapitalize="none" placeholder="2025-01-01"></div>
        <div class="row"><div class="name"><b data-i18n="patch.boot"></b><small data-i18n="patch.boot.hint"></small></div>
          <input type="text" id="patch-boot" autocapitalize="none" placeholder="2025-01-01"></div>
        <div class="row"><div class="name"><b data-i18n="patch.vendor"></b><small data-i18n="patch.vendor.hint"></small></div>
          <input type="text" id="patch-vendor" autocapitalize="none" placeholder="2025-01-01"></div>
        <div class="acts">
          <button class="btn primary" id="save-patch" data-i18n="patch.save"></button>
          <button class="btn sm" id="patch-clear" data-i18n="patch.clear"></button>
        </div>
        <p class="hint" data-i18n="patch.save.hint"></p>
      </div>
    </div>
  </details>

  <details>
    <summary data-i18n="about.title"></summary>
    <div class="body">
      <div class="kv"><span data-i18n="about.version"></span><span id="about-ver">-</span></div>
      <div class="kv"><span data-i18n="about.lang"></span>
        <span><select id="lang" style="width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-size:13px;font-family:inherit"></select></span></div>
      <div class="kv"><span data-i18n="about.qq"></span><span><a href="https://qm.qq.com/cgi-bin/qm/qr?group_code=2167063739" style="color:inherit">2167063739</a></span></div>
      <div class="kv"><span>GitHub</span><span><a href="https://github.com/jiyin004-jpg/ommega" style="color:inherit">jiyin004-jpg/ommega</a></span></div>
      <p class="hint" data-i18n="about.disclaimer"></p>
    </div>
  </details>
</div>

<div id="appview" class="hidden">
  <div class="av-head">
    <b data-i18n="apps.view.title"></b>
    <button class="btn sm" id="app-reload" data-i18n="apps.refresh"></button>
    <button class="btn sm" id="close-apps" data-i18n="apps.done"></button>
  </div>
  <div class="av-body">
    <input type="text" id="app-search" class="av-search" data-i18n-ph="apps.search">
    <div class="toolbar">
      <button class="btn sm" id="pick-all" data-i18n="apps.all"></button>
      <button class="btn sm" id="pick-none" data-i18n="apps.unall"></button>
      <button class="btn sm" id="pick-denylist" data-i18n="apps.denylist"></button>
      <button class="btn sm" id="pick-system" data-i18n="apps.addsys"></button>
    </div>
    <div id="applist"><div class="hint" id="applist-hint"></div></div>
    <p class="hint" data-i18n="apps.list.hint"></p>
  </div>
  <div class="av-foot">
    <span class="hint" id="app-count2"></span>
    <button class="btn primary" id="save-apps" data-i18n="apps.save"></button>
  </div>
</div>

<div id="toast"></div>

function t(key, vars){

  var s = (key in table) ? table[key] : (I18N["zh-CN"][key] || key);

}

/* ---------------------------- 与设备交互（ksu） ---------------------------- */
function exec(cmd){
  return new Promise(function(resolve, reject){
    if (typeof ksu === "undefined" || typeof ksu.exec !== "function"){ reject(new Error(t("toast.noKsu"))); return; }
    var id = "oom_a_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
    window[id] = function(errno, stdout, stderr){
      delete window[id];
      resolve({errno: errno, stdout: stdout || "", stderr: stderr || ""});
    };
    try { ksu.exec(cmd, "{}", id); }
    catch (e){ delete window[id]; reject(e); }
  });
}

function el(tag, cls, text){ var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
function truthy(v){ v = String(v == null ? "" : v).trim().toLowerCase(); return v === "1" || v === "true" || v === "yes" || v === "on"; }
function toast(msg, isErr){
  var e = document.getElementById("toast");
  e.textContent = msg;
  e.className = isErr ? "show err" : "show";
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ e.className = ""; }, 2800);
}
function b64(text){
  var bytes = new TextEncoder().encode(text);
  var bin = "";
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
/* 把 text 里这些键的行整行删掉。 */
function dropKeys(text, keys){
  return text.split("\n").filter(function(line){
    var i = line.indexOf(":");
    if (i <= 0) return true;
    return keys.indexOf(line.slice(0, i).trim()) < 0;
  }).join("\n");
}
async function writeFile(path, text, mode){
  var cmd = "printf '%s' '" + b64(text) + "' | base64 -d > " + path;
  if (mode) cmd += " && chmod " + mode + " " + path;
  return exec(cmd);
}
function parseKV(text, sep){
  var out = {};
  text.split("\n").forEach(function(line){
    var s = line.trim();
    if (!s || s.charAt(0) === "#") return;
    var i = sep ? s.indexOf(":") : s.indexOf("=");
    if (i <= 0) return;
    var k = s.slice(0, i).trim();
    if (!(k in out)) out[k] = s.slice(i + 1).trim();
  });
  return out;
}
/* 逐行合并：受管键就地换值（重复的只留第一行），注释与其他键原样保留，缺的补在末尾。
   dropEmpty=true 时，受管键若没有新值就整行删除。 */
function mergeKV(original, vals, managed, dropEmpty){
  var seen = {}, out = [];
  original.split("\n").forEach(function(line){
    var s = line.trim();
    if (s && s.charAt(0) !== "#"){
      var i = s.indexOf(":");
      if (i > 0){
        var k = s.slice(0, i).trim();
        if (managed.indexOf(k) >= 0){
          if (seen[k]) return;
          seen[k] = true;
          if (!(k in vals)){ if (!dropEmpty) out.push(line); return; }
          out.push(k + ": " + vals[k]);
          return;
        }
      }
    }
    out.push(line);
  });
  var missing = managed.filter(function(k){ return !seen[k] && (k in vals); });
  if (missing.length){
    while (out.length && out[out.length - 1].trim() === "") out.pop();
    out.push("");
    missing.forEach(function(k){ out.push(k + ": " + vals[k]); });
  }
  return out.join("\n").replace(/\s*$/, "") + "\n";
}
function quoteShell(v){ return v === "" ? '""' : '"' + String(v).replace(/(["\\$`])/g, "\\$1") + '"'; }

  inp.autocapitalize = "none";
  inp.dataset.key = f.key;
  row.appendChild(inp);
  (host || document.getElementById("grp-remote")).appendChild(row);
}
function renderRemote(conf){
  var host = document.getElementById("grp-remote");
  var patchHost = document.getElementById("grp-patch");
  host.innerHTML = "";
  patchHost.innerHTML = "";
  REMOTE_FIELDS.forEach(function(f){
    var target = (f.group === "patch") ? patchHost : host;
    var raw = (f.key in conf) ? conf[f.key] : (DEFAULTS[f.key] || "");
    if (f.type === "bool") buildBoolRow(f, truthy(raw), target);
    else buildTextRow(f, raw, target);
  });
}
function collectRemote(){
  var vals = {};
  REMOTE_FIELDS.forEach(function(f){
    if (f.type === "bool"){
      var sw = document.querySelector('.sw[data-key="' + f.key + '"]');
      var on = sw.getAttribute("aria-checked") === "true";
      vals[f.key] = f.oneZero ? (on ? "1" : "0") : (on ? "true" : "false");
    } else {
      vals[f.key] = document.querySelector('input[data-key="' + f.key + '"]').value.trim();
    }
  });
  return vals;
}

/* --------------------------------- 应用 --------------------------------- */
function modeOf(pkg){
  if (curTarget.generate.indexOf(pkg) >= 0) return "generate";
  if (curTarget.hack.indexOf(pkg) >= 0) return "hack";
  return "normal";
}
function renderApps(){
  var box = document.getElementById("applist");
  box.innerHTML = "";
  var kw = appFilter.trim().toLowerCase();
  var shown = appRows.filter(function(a){
    if (!kw) return true;
    return a.pkg.toLowerCase().indexOf(kw) >= 0 || (a.label || "").toLowerCase().indexOf(kw) >= 0;
  });
  if (!shown.length) box.appendChild(el("div", "hint", t("toast.appsEmpty")));
  shown.forEach(function(a){
    var row = el("div", "app" + (a.checked ? " on" : " off"));
    var img = document.createElement("img");
    if (a.icon) img.src = a.icon;
    row.appendChild(img);
    var meta = el("div", "meta");
    meta.appendChild(el("b", null, a.label || a.pkg));
    meta.appendChild(el("small", null, a.pkg));
    row.appendChild(meta);
    var sel = document.createElement("select");
    [["off", "pick.off"], ["normal", "pick.normal"], ["generate", "pick.generate"], ["hack", "pick.hack"]]
      .forEach(function(pair){
        var op = el("option", null, t(pair[1]));
        op.value = pair[0];
        if ((a.checked ? a.mode : "off") === pair[0]) op.selected = true;
        sel.appendChild(op);
      });
    sel.onchange = function(){
      a.checked = sel.value !== "off";
      a.mode = sel.value === "off" ? "normal" : sel.value;
      row.className = "app" + (a.checked ? " on" : " off");
      updateCount();
    };
    row.appendChild(sel);
    box.appendChild(row);
  });
  updateCount();
}
function updateCount(){
  var n = appRows.filter(function(a){ return a.checked; }).length;
  var e = document.getElementById("app-count2");
  if (e && appRows.length) e.textContent = n ? t("apps.selected", {n:n}) : t("apps.none");
}
async function refreshCount(){
  var r = await exec("cat " + TARGET + " 2>/dev/null");
  var n = (r.stdout || "").split("\n").filter(function(l){ return l.trim(); }).length;
  document.getElementById("app-count").textContent = n ? t("apps.n", {n:n}) : t("apps.none");
}
function loadPackages(){
  return exec("(pm list packages -3 2>/dev/null | sed 's/^package://'; echo '---'; pm list packages -s 2>/dev/null | sed 's/^package://')")
    .then(function(r){
      var parts = r.stdout.split("---");
      var user = (parts[0] || "").split("\n").map(function(s){ return s.trim(); }).filter(Boolean);
      var sys = (parts[1] || "").split("\n").map(function(s){ return s.trim(); }).filter(Boolean);
      var sysSet = {};
      sys.forEach(function(p){ sysSet[p] = true; });
      return {all: user.concat(sys), system: sysSet};
    });
}
function loadLabels(pkgs){
  return new Promise(function(resolve){
    if (typeof ksu === "undefined" || typeof ksu.getPackagesInfo !== "function") return resolve({});
    try {
      var list = JSON.parse(ksu.getPackagesInfo(JSON.stringify(pkgs)) || "[]");
      var map = {};
      list.forEach(function(it){ var p = it.packageName || it.package; if (p) map[p] = it.appLabel || it.label || ""; });
      resolve(map);
    } catch (e){ resolve({}); }
  });
}
async function reloadAppFiles(){
  var r = await exec("cat " + TARGET + " 2>/dev/null; echo '---S---'; cat " + SYSTEMAPP + " 2>/dev/null");
  var parts = r.stdout.split("---S---");
  var gen = [], hack = [], norm = [];
  (parts[0] || "").split("\n").forEach(function(line){
    var s = line.trim();
    if (!s) return;
    if (/!$/.test(s)) gen.push(s.slice(0, -1));
    else if (/\?$/.test(s)) hack.push(s.slice(0, -1));
    else norm.push(s);
  });
  var sysSet = {};
  (parts[1] || "").split("\n").forEach(function(line){ var s = line.trim(); if (s) sysSet[s] = true; });
  curTarget = {normal: norm, generate: gen, hack: hack};
  return sysSet;
}
async function loadApps(){
  var hint = document.getElementById("applist-hint");
  if (hint) hint.textContent = t("apps.loading");
  var sysSet = {};
  try { sysSet = await reloadAppFiles(); } catch (e){}
  var pkgs;
  try { pkgs = await loadPackages(); }
  catch (e){ toast(t("toast.appsFail", {msg: e.message}), true); return; }
  var listed = {};
  curTarget.normal.concat(curTarget.generate, curTarget.hack).forEach(function(p){ listed[p] = true; });
  Object.keys(sysSet).forEach(function(p){ listed[p] = true; });
  var all = pkgs.all.filter(function(v, i, a){ return a.indexOf(v) === i; });
  Object.keys(listed).forEach(function(p){ if (all.indexOf(p) < 0) all.push(p); });
  var labels = await loadLabels(all.slice(0, 400));
  var canIcon = (typeof ksu !== "undefined" && ksu && typeof ksu.getPackagesInfo === "function");
  appRows = all.map(function(p){
    return {
      pkg: p, label: labels[p] || "",
      icon: canIcon ? ("ksu://icon/" + p) : "",
      mode: modeOf(p), checked: !!listed[p], system: !!sysSet[p] || !!pkgs.system[p]
    };
  });
  renderApps();
}
async function openAppView(){
  document.getElementById("appview").className = "";
  if (!appRows.length){
    try { await loadApps(); } catch (e){ toast(t("toast.appsFail", {msg: e.message}), true); }
  }
}
function closeAppView(){
  document.getElementById("appview").className = "hidden";
  refreshCount().catch(function(){});
}

/* --------------------------------- 状态 --------------------------------- */
/* 用 pidof，不扫 /proc：扫 /proc 要对上千个进程各 cat 一次，首屏会卡好几秒。 */
async function refreshStatus(){
  var r = await exec("pidof keymint 2>/dev/null; echo '---'; pidof keystore2 2>/dev/null; echo '---'; pidof adbrd 2>/dev/null");
  var p = r.stdout.split("---");
  function first(s){ s = (s || "").trim(); return s ? s.split(/\s+/)[0] : ""; }
  [["st-keymint", first(p[0])], ["st-keystore", first(p[1])], ["st-adbr", first(p[2])]].forEach(function(pair){
    var pid = pair[1];
    document.getElementById(pair[0]).innerHTML = pid
      ? '<i class="dot on"></i>' + t("status.running", {p: pid})
      : '<i class="dot off"></i>' + t("status.stopped");
  });
}

/* --------------------------------- 动作 --------------------------------- */
async function saveRemote(){
  var text = mergeKV(curConfText, collectRemote(), MANAGED, false);
  var r = await writeFile(CONF, text, "644");
  if (r.errno !== 0){ toast(t("toast.saveFail", {msg: r.stderr || r.errno}), true); return; }
  curConfText = text;
  toast(t("toast.saved"));
  setTimeout(function(){ refreshStatus().catch(function(){}); }, 2000);
}
function serverBase(){
  var conf = parseKV(curConfText, true);
  var inp = document.querySelector('input[data-key="url"]');
  var v = (inp && inp.value.trim()) || conf.url || DEFAULTS.url;
  return String(v).replace(/\/+$/, "");
}
async function openStatus(){
  try {
    await exec('am start --user 0 -a android.intent.action.VIEW -d "' + serverBase() + '/status" >/dev/null 2>&1');
  } catch (e){ toast(t("toast.statusFail"), true); }
}
async function saveApps(){
  var normal = [], generate = [], hack = [];
  appRows.forEach(function(a){
    if (!a.checked) return;
    if (a.mode === "generate") generate.push(a.pkg);
    else if (a.mode === "hack") hack.push(a.pkg);
    else normal.push(a.pkg);
  });
  var lines = normal.concat(generate.map(function(p){ return p + "!"; }), hack.map(function(p){ return p + "?"; }))
                    .filter(function(v, i, arr){ return arr.indexOf(v) === i; }).sort();
  var r = await writeFile(TARGET, lines.join("\n") + (lines.length ? "\n" : ""), "644");
  if (r.errno !== 0){ toast(t("toast.saveFail", {msg: r.stderr || r.errno}), true); return; }
  var sysList = appRows.filter(function(a){ return a.checked && a.system; }).map(function(a){ return a.pkg; }).sort();
  var r2 = await writeFile(SYSTEMAPP, sysList.join("\n") + (sysList.length ? "\n" : ""), "644");
  if (r2.errno !== 0) toast(t("toast.appsPartial"), true);
  else toast(t("toast.appsSaved", {n: lines.length}));
  refreshCount().catch(function(){});
}
async function savePatch(){
  var hash = document.getElementById("boot-hash").value.trim().toLowerCase();
  var sys  = document.getElementById("patch-system").value.trim();
  var boot = document.getElementById("patch-boot").value.trim();
  var vend = document.getElementById("patch-vendor").value.trim();
  if (hash && !/^[0-9a-f]{64}$/.test(hash)){ toast(t("toast.hashBad"), true); return; }
  for (var pair of [["patch.system", sys], ["patch.boot", boot], ["patch.vendor", vend]]){
    if (pair[1] && !/^\d{4}-\d{2}-\d{2}$/.test(pair[1])){ toast(t("toast.patchBad", {field: t(pair[0])}), true); return; }
  }
  var kv = {};
  if (hash) kv["ro.boot.vbmeta.digest"] = hash;
  if (sys)  kv["ro.build.version.security_patch"] = sys;
  if (boot) kv["ro.boot.image.build.security_patch"] = boot;
  if (vend) kv["ro.vendor.build.security_patch"] = vend;

  var text = dropKeys(mergeKV(curPropsText, kv, PROP_KEYS, true), RETIRED_KEYS);
  if (!curPropsText.trim()){
    text = "# 开机时统一应用的系统属性覆盖（面板「伪装参数」写的就是这里）。\n" +
           "# 一行一项，格式 `键: 值`；# 开头是注释；空值 = 不覆盖（由模块自己的默认值决定）。\n" +
           "# 为什么不写在 post-fs-data.sh 里：模块升级会把那个脚本整个换掉，写进去的设置会丢。\n" + text;
  }
  var r = await writeFile(PROPS, text, "0644");
  if (r.errno !== 0){ toast(t("toast.saveFail", {msg: r.stderr || r.errno}), true); return; }
  curPropsText = text;

  var now = [], vals = {};
  if (sys){ now.push("ro.build.version.security_patch"); vals["ro.build.version.security_patch"] = sys; }
  if (boot){ now.push("ro.boot.image.build.security_patch"); vals["ro.boot.image.build.security_patch"] = boot; }
  if (vend){ now.push("ro.vendor.build.security_patch"); vals["ro.vendor.build.security_patch"] = vend; }
  if (now.length){
    await exec(now.map(function(k){
      return '(R=' + RESETPROP + '; [ -x "$R" ] || R=resetprop; "$R" -n ' + k + " " + quoteShell(vals[k]) + ")";
    }).join("; "));
  }
  toast(now.length ? t("toast.savedApplied") : t("toast.savedBoot"));
  refreshPatchSummary();
}
function refreshPatchSummary(){
  function v(id){ var e = document.getElementById(id); return e ? (e.value || "").trim() : ""; }
  var items = [];
  if (v("patch-system")) items.push(t("patch.system") + " " + v("patch-system"));
  if (v("patch-boot")) items.push(t("patch.boot") + " " + v("patch-boot"));
  if (v("patch-vendor")) items.push(t("patch.vendor") + " " + v("patch-vendor"));
  if (v("boot-hash")) items.push(t("patch.hash"));
  document.getElementById("patch-summary").textContent = items.length ? items.join(" · ") : t("patch.none");
}
/* 服务端上报的补丁级别是数字：YYYYMM（系统）或 YYYYMMDD（启动/厂商），
   而属性写法是 YYYY-MM-DD。 */
function patchDate(v){
  if (v === null || v === undefined || v === "") return "";
  var s = String(v).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  if (/^\d{6}$/.test(s)) return s.slice(0, 4) + "-" + s.slice(4, 6) + "-01";
  if (/^\d{8}$/.test(s)) return s.slice(0, 4) + "-" + s.slice(4, 6) + "-" + s.slice(6, 8);
  return s;
}
function androidMajor(v){
  var n = Number(v);
  if (!isFinite(n) || n <= 0) return "";
  return n >= 10000 ? String(Math.floor(n / 10000)) : String(n);
}
/* 在线设备里挑一台：keymint 有效、已锁定、可信启动；按负载从轻到重。 */
function pickBestDevice(list){
  var ok = [];
  for (var i = 0; i < list.length; i++){
    var d = list[i];
    if (!d || !d.boot || d.tee_error) continue;
    if (d.boot.device_locked !== true) continue;
    if (Number(d.boot.verified_boot_state) !== 0) continue;
    ok.push(d);
  }
  ok.sort(function(a, b){ return (Number(a.load) || 0) - (Number(b.load) || 0); });
  return ok.length ? ok[0] : null;
}
function fieldVal(key, fallback){
  var inp = document.querySelector('input[data-key="' + key + '"]');
  if (inp && String(inp.value).trim()) return String(inp.value).trim();
  return fallback || "";
}
async function fetchDeviceBoot(){
  var base = fieldVal("url", serverBase());
  var id = fieldVal("device_id", "");
  if (base.indexOf("'") >= 0){ toast(t("toast.noNet"), true); return false; }
  var r = await exec("curl -s --connect-timeout 8 '" + base + "/api/status/' 2>/dev/null");
  if (r.errno !== 0 || !r.stdout.trim()){ toast(t("toast.noNet"), true); return false; }
  var data;
  try { data = JSON.parse(r.stdout); } catch (e){ toast(t("toast.notJson"), true); return false; }
  var list = (data && (data.online_b_devices || data.connected)) || [];
  var hit = null, auto = false;
  if (id){
    for (var i = 0; i < list.length; i++){ if (list[i] && list[i].device_id === id){ hit = list[i]; break; } }
    if (!hit){ toast(t("toast.noDevice", {id: id}), true); return false; }
  } else {
    hit = pickBestDevice(list);
    auto = true;
    if (!hit){ toast(t("toast.noCandidate", {n: list.length}), true); return false; }
    document.querySelector('input[data-key="device_id"]').value = hit.device_id;
  }
  if (!hit.boot){ toast(t("toast.noBoot"), true); return false; }
  var b = hit.boot;
  document.getElementById("boot-hash").value = b.boot_hash || "";
  document.getElementById("patch-system").value = patchDate(b.patch_system);
  document.getElementById("patch-boot").value = patchDate(b.patch_boot);
  document.getElementById("patch-vendor").value = patchDate(b.patch_vendor);
  var major = androidMajor(b.os_version);
  var name = (hit.machine_id || hit.device_id) + (major ? " (Android " + major + ")" : "");
  toast(auto ? t("toast.pickedAuto", {name: name}) : t("toast.picked", {name: name}));
  return true;
}
async function syncPatch(){
  if (!(await fetchDeviceBoot())) return;
  await savePatch();
  await saveRemote();
  refreshPatchSummary();
}

/* -------------------------------- 语言切换 ------------------------------- */
function setLang(code){
  if (!I18N[code]) code = "zh-CN";
  LANG = code;
  try { localStorage.setItem("ommega.lang", code); } catch (e){}
  applyI18n();
  /* 动态生成的那几块要重画一遍 */
  renderRemote(parseKV(curConfText, true));
  fillPatchInputs();          /* 重画会清掉输入框，先把值读出来再填回去 */
  if (appRows.length) renderApps();
  refreshStatus().catch(function(){});
  refreshCount().catch(function(){});
  refreshPatchSummary();
  document.getElementById("lang").value = code;
}

/* --------------------------------- 初始化 -------------------------------- */
var patchValues = {};
function capturePatchInputs(){
  ["boot-hash", "patch-system", "patch-boot", "patch-vendor"].forEach(function(id){
    var e = document.getElementById(id);
    if (e) patchValues[id] = e.value;
  });
}
function fillPatchInputs(){
  ["boot-hash", "patch-system", "patch-boot", "patch-vendor"].forEach(function(id){
    var e = document.getElementById(id);
    if (e && patchValues[id] !== undefined) e.value = patchValues[id];
  });
}

(async function init(){
  try {
    try { LANG = localStorage.getItem("ommega.lang") || (navigator.language || "").replace("_", "-"); } catch (e){}
    if (!I18N[LANG]){
      var short = String(LANG).split("-")[0];
      LANG = (short === "zh") ? "zh-CN" : (I18N[short] ? short : "en");
    }
    if (!I18N[LANG]) LANG = "zh-CN";

    var r = await exec(
      "cat " + CONF + " 2>/dev/null; echo '---P---'; cat " + PROPS + " 2>/dev/null; " +
      "echo '---M---'; cat " + MOD + "/module.prop 2>/dev/null"
    );
    var parts = r.stdout.split("---P---");
    curConfText = parts[0] || "";
    var parts2 = (parts[1] || "").split("---M---");
    curPropsText = parts2[0] || "";
    var prop = parts2[1] || "";

    var ver = "?";
    prop.split("\n").forEach(function(l){ if (l.indexOf("version=") === 0) ver = l.slice(8).trim(); });

    /* 语言选择器 */
    var langSel = document.getElementById("lang");
    LANGS.forEach(function(pair){
      var op = el("option", null, pair[1]);
      op.value = pair[0];
      langSel.appendChild(op);
    });
    langSel.value = LANG;
    langSel.onchange = function(){ setLang(langSel.value); };

    applyI18n();
    document.getElementById("modline").textContent = t("about.version") + " " + ver;
    document.getElementById("about-ver").textContent = ver;

    renderRemote(parseKV(curConfText, true));

    var rp = {};
    curPropsText.split("\n").forEach(function(line){
      var m = /^([A-Za-z0-9_.]+)\s*:\s*(.*)$/.exec(line.trim());
      if (m && PROP_KEYS.indexOf(m[1]) >= 0) rp[m[1]] = m[2].trim();
    });
    patchValues = {
      "boot-hash": rp["ro.boot.vbmeta.digest"] || "",
      "patch-system": rp["ro.build.version.security_patch"] || "",
      "patch-boot": rp["ro.boot.image.build.security_patch"] || "",
      "patch-vendor": rp["ro.vendor.build.security_patch"] || ""
    };
    fillPatchInputs();
    refreshPatchSummary();

    document.getElementById("open-status").onclick = function(){
      capturePatchInputs();
      openStatus().catch(function(){ toast(t("toast.statusFail"), true); });
    };
    document.getElementById("save-remote").onclick = function(){
      capturePatchInputs();
      saveRemote().catch(function(e){ toast(t("toast.saveFail", {msg: e.message}), true); });
    };
    document.getElementById("open-apps").onclick = function(){
      capturePatchInputs();
      openAppView().catch(function(e){ toast(t("toast.appsFail", {msg: e.message}), true); });
    };
    document.getElementById("close-apps").onclick = function(){ closeAppView(); };
    document.getElementById("app-reload").onclick = function(){
      appRows = [];
      loadApps().catch(function(e){ toast(t("toast.appsFail", {msg: e.message}), true); });
    };
    document.getElementById("save-apps").onclick = function(){
      saveApps().catch(function(e){ toast(t("toast.saveFail", {msg: e.message}), true); });
    };
    document.getElementById("app-search").oninput = function(ev){ appFilter = ev.target.value || ""; renderApps(); };
    document.getElementById("pick-all").onclick = function(){ appRows.forEach(function(a){ a.checked = true; }); renderApps(); };
    document.getElementById("pick-none").onclick = function(){ appRows.forEach(function(a){ a.checked = false; }); renderApps(); };
    document.getElementById("pick-denylist").onclick = function(){
      exec("magisk --denylist ls 2>/dev/null | awk -F'|' '{print $1}' | grep -v isolated | sort -u").then(function(rr){
        var set = {};
        (rr.stdout || "").split("\n").forEach(function(l){ var s = l.trim(); if (s) set[s] = true; });
        var hit = 0;
        appRows.forEach(function(a){ if (set[a.pkg]){ a.checked = true; hit++; } });
        renderApps();
        return exec("touch " + DATA + "/target_from_denylist").then(function(){
          toast(t("toast.denyPicked", {n: hit}));
        });
      }).catch(function(e){ toast(t("toast.denyFail", {msg: e.message}), true); });
    };
    document.getElementById("pick-system").onclick = function(){
      var pkg = (window.prompt(t("apps.addsys")) || "").trim();
      if (!pkg) return;
      exec("pm list packages -s 2>/dev/null | grep -q '^package:" + pkg + "$'").then(function(rr){
        if (rr.errno !== 0){ toast(t("toast.sysMissing", {pkg: pkg}), true); return; }
        var found = appRows.filter(function(a){ return a.pkg === pkg; })[0];
        if (found){ found.checked = true; found.system = true; }
        else appRows.push({pkg: pkg, label: "", icon: "ksu://icon/" + pkg, mode: "normal", checked: true, system: true});
        renderApps();
        toast(t("toast.sysAdded", {pkg: pkg}));
      });
    };
    document.getElementById("patch-edit").onclick = function(){
      var box = document.getElementById("patch-manual");
      box.className = box.className === "hidden" ? "" : "hidden";
    };
    document.getElementById("patch-sync").onclick = function(){
      capturePatchInputs();
      syncPatch().catch(function(e){ toast(t("toast.saveFail", {msg: e.message}), true); });
    };
    document.getElementById("patch-clear").onclick = function(){
      ["boot-hash", "patch-system", "patch-boot", "patch-vendor"].forEach(function(id){
        document.getElementById(id).value = "";
        patchValues[id] = "";
      });
      refreshPatchSummary();
      toast(t("toast.cleared"));
    };
    document.getElementById("save-patch").onclick = function(){
      capturePatchInputs();
      savePatch().catch(function(e){ toast(t("toast.saveFail", {msg: e.message}), true); });
    };
    /* 输入框改动随时记下来，切语言重画时不会丢。 */
    ["boot-hash", "patch-system", "patch-boot", "patch-vendor"].forEach(function(id){
      document.getElementById(id).addEventListener("input", capturePatchInputs);
    });

    /* 首屏先显示出来，状态与计数在后台跑完自己填。 */
    document.getElementById("boot").className = "hidden";
    document.getElementById("panel").className = "";
    refreshStatus().catch(function(){});
    refreshCount().catch(function(){});
  } catch (e){
    document.getElementById("boot").textContent = t("toast.initFail", {msg: e.message});
  }
})();
</script>
